openapi: "3.0.3"
info:
  title: "Orca Core API"
  version: "0.6.0"
  description: "Go + Odin Hybrid Algorithmic Trading Engine — Multi‑User, Multi‑Account, Audit‑Ready"
servers:
  - url: "http://localhost:8080/api/v1"
    description: "Development server"
security:
  - bearerAuth: []
paths:
  # ── Auth ──
  /auth/login:
    post:
      tags: [Auth]
      summary: "Login"
      requestBody:
        content: { application/json: { schema: { type: object, properties: { username: { type: string }, password: { type: string }, totp_code: { type: string } } } } }
      responses: { '200': { description: "JWT token pair" } }
  /auth/register:
    post:
      tags: [Auth]
      summary: "Register user"
      requestBody:
        content: { application/json: { schema: { type: object, properties: { username: { type: string }, password: { type: string }, email: { type: string } } } } }
      responses: { '201': { description: "User created" } }
  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: "Request password reset"
      requestBody:
        content: { application/json: { schema: { type: object, properties: { email: { type: string } } } } }
      responses: { '200': { description: "Reset email sent if account exists" } }
  /auth/reset-password:
    post:
      tags: [Auth]
      summary: "Reset password with token"
      requestBody:
        content: { application/json: { schema: { type: object, properties: { token: { type: string }, new_password: { type: string } } } } }
      responses: { '200': { description: "Password reset" } }
  /auth/verify-email:
    get:
      tags: [Auth]
      summary: "Verify email address"
      parameters: [{ name: token, in: query, required: true, schema: { type: string } }]
      responses: { '200': { description: "Email verified" } }
  /auth/resend-verification:
    post:
      tags: [Auth]
      summary: "Resend verification email"
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: "Verification email resent" } }
  /auth/2fa/setup:
    post:
      tags: [Auth]
      summary: "Setup TOTP 2FA"
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: "TOTP secret + URI" } }

  # ── System ──
  /health:
    get:
      tags: [System]
      summary: "System health (public)"
      responses: { '200': { description: "Component health status" } }
  /settings:
    get:
      tags: [Settings]
      summary: "Get all application settings"
      responses: { '200': { description: "Settings object" } }
    put:
      tags: [Settings]
      summary: "Update settings"
      requestBody:
        content: { application/json: { schema: { type: object, additionalProperties: { type: object } } } }
      responses: { '200': { description: "Updated" } }
  /settings/notifications:
    get:
      tags: [Notifications]
      summary: "Get notification settings"
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: "Per-channel notification config" } }
    put:
      tags: [Notifications]
      summary: "Update notification settings"
      security: [{ bearerAuth: [] }]
      requestBody:
        content: { application/json: { schema: { type: object, properties: { settings: { type: object } } } } }
      responses: { '200': { description: "Updated" } }
  /settings/notifications/test:
    post:
      tags: [Notifications]
      summary: "Send test notification"
      security: [{ bearerAuth: [] }]
      requestBody:
        content: { application/json: { schema: { type: object, properties: { channel: { type: string } } } } }
      responses: { '200': { description: "Test sent" } }

  # ── Admin ──
  /admin/health:
    get:
      tags: [Admin]
      summary: "Admin health check (DB + components)"
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: "Health status" } }
  /admin/seed:
    post:
      tags: [Admin]
      summary: "Seed database"
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: "Seed result + integrity report" } }
  /admin/verify:
    get:
      tags: [Admin]
      summary: "Verify database integrity"
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: "Integrity report" } }
  /admin/info:
    get:
      tags: [Admin]
      summary: "Seed data inventory"
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: "Seed inventory" } }
  /admin/audit:
    get:
      tags: [Admin]
      summary: "Audit logs (legacy)"
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: "Audit log entries" } }
  /admin/kill-history:
    get:
      tags: [Admin]
      summary: "Kill switch history"
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: "Kill switch events" } }
  /admin/email/test:
    post:
      tags: [Admin]
      summary: "Test SMTP connection"
      security: [{ bearerAuth: [] }]
      requestBody:
        content: { application/json: { schema: { type: object, properties: { host: { type: string }, port: { type: string }, username: { type: string }, password: { type: string }, from: { type: string }, from_name: { type: string } } } } }
      responses: { '200': { description: "Connection result" } }
  /admin/email/config:
    put:
      tags: [Admin]
      summary: "Save SMTP configuration"
      security: [{ bearerAuth: [] }]
      requestBody:
        content: { application/json: { schema: { type: object, properties: { host: { type: string }, port: { type: string }, username: { type: string }, password: { type: string }, from: { type: string }, from_name: { type: string } } } } }
      responses: { '200': { description: "Saved" } }
  /admin/users:
    get:
      tags: [Admin]
      summary: "List all users"
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: "User list" } }
  /admin/users/{id}/disable:
    put:
      tags: [Admin]
      summary: "Disable user"
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: "Disabled" } }
  /admin/users/{id}/enable:
    put:
      tags: [Admin]
      summary: "Enable user"
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: "Enabled" } }
  /admin/users/{id}/reset-password:
    put:
      tags: [Admin]
      summary: "Admin password reset"
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        content: { application/json: { schema: { type: object, properties: { new_password: { type: string } } } } }
      responses: { '200': { description: "Password reset" } }

  # ── Audit ──
  /audit:
    get:
      tags: [Audit]
      summary: "List audit log entries (structured)"
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: user_id, in: query, schema: { type: string } }
        - { name: action, in: query, schema: { type: string } }
        - { name: resource_type, in: query, schema: { type: string } }
        - { name: start, in: query, schema: { type: string, format: date-time } }
        - { name: end, in: query, schema: { type: string, format: date-time } }
      responses: { '200': { description: "Audit entries" } }
  /audit/errors:
    get:
      tags: [Audit]
      summary: "List error logs"
      security: [{ bearerAuth: [] }]
      parameters: [{ name: component, in: query, schema: { type: string } }]
      responses: { '200': { description: "Error log entries" } }

  # ── Strategies ──
  /strategies:
    get:
      tags: [Strategies]
      summary: "List strategies"
      responses: { '200': { description: "Strategy list" } }
    post:
      tags: [Strategies]
      summary: "Create strategy"
      responses: { '201': { description: "Created" } }
  /strategies/validate:
    post:
      tags: [Strategies]
      summary: "Validate strategy (orca validate --stdin)"
      responses: { '200': { description: "Validation result" } }

  # ── Backtest ──
  /backtests:
    post:
      tags: [Backtest]
      summary: "Submit backtest"
      responses: { '202': { description: "Accepted" } }
  /optimize:
    post:
      tags: [Backtest]
      summary: "Walk-forward optimization"
      responses: { '200': { description: "Optimization result" } }

  # ── Trading ──
  /orders:
    get:
      tags: [Trading]
      summary: "List orders"
      responses: { '200': { description: "Order list" } }
    post:
      tags: [Trading]
      summary: "Place order"
      requestBody:
        content: { application/json: { schema: { type: object, properties: { account_id: { type: string }, symbol: { type: string }, side: { type: string }, type: { type: string }, quantity: { type: number }, limit_price: { type: number }, stop_price: { type: number }, time_in_force: { type: string }, strategy_id: { type: string } } } } }
      responses: { '201': { description: "Order placed" } }
    delete:
      tags: [Trading]
      summary: "Cancel all orders"
      parameters: [{ name: account_id, in: query, schema: { type: string } }]
      responses: { '200': { description: "Cancelled" } }
  /positions:
    get:
      tags: [Trading]
      summary: "Get open positions"
      parameters: [{ name: account_id, in: query, schema: { type: string } }]
      responses: { '200': { description: "Position list" } }
  /accounts:
    get:
      tags: [Trading]
      summary: "List accounts"
      responses: { '200': { description: "Account list with balances" } }
    post:
      tags: [Trading]
      summary: "Create account"
      responses: { '201': { description: "Created" } }
  /candles:
    get:
      tags: [Market Data]
      summary: "Get candles"
      parameters: [{ name: symbol, in: query, schema: { type: string } }, { name: range, in: query, schema: { type: string } }]
      responses: { '200': { description: "Candle array" } }

  # ── Risk ──
  /risk/status:
    get:
      tags: [Risk]
      summary: "Get risk status"
      responses: { '200': { description: "Risk snapshot" } }
  /emergency/stop:
    post:
      tags: [Risk]
      summary: "Trigger kill switch (2FA required)"
      parameters: [{ name: X-2FA-Token, in: header, required: true, schema: { type: string } }]
      responses: { '200': { description: "Halted" } }
  /emergency/resume:
    post:
      tags: [Risk]
      summary: "Resume trading (2FA required)"
      parameters: [{ name: X-2FA-Token, in: header, required: true, schema: { type: string } }]
      responses: { '200': { description: "Resumed" } }

  # ── Brokers / Providers ──
  /providers:
    get:
      tags: [Brokers]
      summary: "List providers"
      responses: { '200': { description: "Provider list" } }
    post:
      tags: [Brokers]
      summary: "Add provider"
      responses: { '201': { description: "Created" } }

  # ── Data Sources ──
  /data-sources:
    get:
      tags: [Data Sources]
      summary: "List data sources"
      responses: { '200': { description: "Data source list" } }

  # ── Symbols ──
  /symbols:
    get:
      tags: [Symbols]
      summary: "List symbols"
      responses: { '200': { description: "Symbol list" } }
    post:
      tags: [Symbols]
      summary: "Add symbol"
      responses: { '201': { description: "Created" } }

  # ── Prop Firm ──
  /propfirm/profiles:
    get:
      tags: [Prop Firm]
      summary: "List prop firm profiles"
      responses: { '200': { description: "Profile list" } }
  /propfirm/status:
    get:
      tags: [Prop Firm]
      summary: "Get current prop firm state"
      responses: { '200': { description: "State object" } }

  # ── Webhooks ──
  /webhooks/tradingview:
    post:
      tags: [Webhooks]
      summary: "TradingView alert webhook"
      responses: { '202': { description: "Queued" } }

  # ── LLM ──
  /llm/test:
    post:
      tags: [LLM]
      summary: "Test LLM connection"
      responses: { '200': { description: "Test result" } }

  # ── Monitor ──
  /monitor/regime-history:
    get:
      tags: [Monitor]
      summary: "Get HMM regime history"
      responses: { '200': { description: "Regime logs" } }

  # ── Credentials ──
  /credentials:
    get:
      tags: [Credentials]
      summary: "List credentials"
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: "Credential list" } }
    post:
      tags: [Credentials]
      summary: "Store credential"
      security: [{ bearerAuth: [] }]
      responses: { '201': { description: "Stored" } }

  # ── WebSocket ──
  /ws:
    get:
      tags: [WebSocket]
      summary: "WebSocket connection"
      description: "Channels: ticks, orders, positions, risk, account_status, notification, signal_lifecycle, strategy_metrics, pnl_history, fill"

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
    twoFAAuth: { type: apiKey, in: header, name: X-2FA-Token }
