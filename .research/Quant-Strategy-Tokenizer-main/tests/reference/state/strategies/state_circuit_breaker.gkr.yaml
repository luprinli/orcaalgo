schema_version: qst-ir-schema/0.4
ir_version: qst-ir/0.4
canonical_version: qst-canonical/0.4
capabilities:
  - core
strategy:
  id: state_circuit_breaker
  version: 1
  nodes:
    - id: breach_count
      token_ref:
        namespace: core
        name: state.accumulate
        version: 1
        behavior_version: 1
      params:
        reducer: sum
      signature:
        inputs:
          x:
            type: TimeSeries[int]
        outputs:
          y:
            type: TimeSeries[int]
    - id: breaker_fsm
      token_ref:
        namespace: core
        name: state.fsm
        version: 1
        behavior_version: 1
      inputs:
        event: breach_count.y
      params:
        recipe: circuit_breaker
      signature:
        inputs:
          event:
            type: EventStream[string]
        outputs:
          state:
            type: State[string]
  outputs:
    state: breaker_fsm.state
metadata:
  reference_validation: state-reference
  reference_case: state_circuit_breaker
  fixture: tests/reference/state/fixtures/state_circuit_breaker.json
