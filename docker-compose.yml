services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: ${DB_USER:-orca}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me}
      POSTGRES_DB: ${DB_NAME:-orca_core}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-orca} -d ${DB_NAME:-orca_core}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - orca-net

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - orca-net

  # Optional: Docker-based API server. For production, use the native binary
  # started by scripts/orchestrate.py --production instead.
  # Start manually: docker compose up app
  app:
    image: orca-core:latest
    container_name: orca-server
    ports:
      - "8081:8080"
      - "9091:9090"
    env_file:
      - .env
    environment:
      - ORCA_DB_HOST=postgres
      - ORCA_DB_PORT=5432
      - ORCA_DB_USER=${DB_USER:-orca}
      - ORCA_DB_PASSWORD=${DB_PASSWORD:-change_me}
      - ORCA_DB_NAME=${DB_NAME:-orca_core}
      - ORCA_DB_SSLMODE=disable
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PAPER_TRADING=${PAPER_TRADING:-true}
      - ORCA_JWT_SECRET=${ORCA_JWT_SECRET:-dev-secret-change-in-production}
      - ORCA_ADMIN_PASSWORD=${ORCA_ADMIN_PASSWORD:-admin123}
      - ORCA_DB_URL=postgresql://${DB_USER:-orca}:${DB_PASSWORD:-change_me}@postgres:5432/${DB_NAME:-orca_core}
      - PYTHONUNBUFFERED=1
      - ORCA_DATA_MODE=stooq
      - ORCA_METRICS_PORT=:9090
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - orca-net

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./configs/alerts.yml:/etc/prometheus/alerts.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    depends_on:
      - app
    networks:
      - orca-net

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-change_me}
      ORCA_JWT_SECRET: ${ORCA_JWT_SECRET:-dev-secret-change-in-production}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./configs/grafana/grafana.ini:/etc/grafana/grafana.ini
      - ./configs/grafana/jwt_secret.txt:/etc/grafana/jwt_secret.txt
      - ./configs/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./configs/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./docs/grafana/dashboards:/etc/grafana/dashboards
    depends_on:
      - prometheus
    networks:
      - orca-net

volumes:
  pgdata:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  orca-net:
    driver: bridge
