ir_version: "qst-ir/0.4"
canonical_version: "qst-canonical/0.4"
strategy:
  id: "orca-rsi-divergence-v1"
  version: "1.0.0"
  nodes:
    - id: "divergence_signal"
      token_ref:
        token_id: "signal.rsi_divergence"
        version: ">=1.0"
      params:
        rsi_period: 9
        pivot_left: 1
        pivot_right: 3
        range_lower: 5
        range_upper: 60
    - id: "adx_filter"
      token_ref:
        token_id: "filter.adx"
        version: ">=1.0"
      inputs:
        signal: "divergence_signal.signal"
      params:
        length: 14
        threshold: 22.0
    - id: "supertrend_filter"
      token_ref:
        token_id: "filter.supertrend"
        version: ">=1.0"
      inputs:
        signal: "adx_filter.signal"
      params:
        atr_multiplier: 4.0
        atr_length: 14
    - id: "position_sizer"
      token_ref:
        token_id: "size.kelly_fractional"
        version: ">=1.0"
      inputs:
        signal: "supertrend_filter.signal"
      params:
        multiplier: 0.25
        per_trade_cap_pct: 0.02
        total_exposure_cap_pct: 0.30
    - id: "risk_gate"
      token_ref:
        token_id: "risk.propfirm_compliance"
        version: ">=1.0"
      inputs:
        size: "position_sizer.contracts"
        signal: "supertrend_filter.signal"
      params:
        max_daily_dd_pct: 5.0
        max_absolute_dd: 1000.0
        max_open_positions: 5
  outputs:
    signal: "supertrend_filter.signal"
    size: "position_sizer.contracts"
    final: "risk_gate.approved_size"
capabilities:
  - core
