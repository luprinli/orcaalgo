ir_version: "qst-ir/0.4"
canonical_version: "qst-canonical/0.4"
strategy:
  id: "orca-vwap-mr-v1"
  version: "1.0.0"
  nodes:
    - id: "bar_agg"
      token_ref:
        token_id: "data.bar_aggregator"
        version: ">=1.0"
      params:
        timeframe: "5m"
    - id: "vwap_calc"
      token_ref:
        token_id: "indicator.vwap"
        version: ">=1.0"
      inputs:
        price: "bar_agg.close"
        volume: "bar_agg.volume"
      params:
        lookback: 20
    - id: "zscore_calc"
      token_ref:
        token_id: "math.zscore"
        version: ">=1.0"
      inputs:
        series: "bar_agg.close"
        mean: "vwap_calc.vwap"
      params:
        lookback: 20
    - id: "signal_gen"
      token_ref:
        token_id: "signal.threshold"
        version: ">=1.0"
      inputs:
        zscore: "zscore_calc.z"
      params:
        entry_threshold: 1.5
        exit_threshold: 0.5
    - id: "regime_gate"
      token_ref:
        token_id: "risk.regime_filter"
        version: ">=1.0"
      inputs:
        signal: "signal_gen.signal"
      params:
        blocked_states: [1, 2, 3]
    - id: "position_sizer"
      token_ref:
        token_id: "size.kelly_fractional"
        version: ">=1.0"
      inputs:
        signal: "regime_gate.signal"
      params:
        multiplier: 0.25
        per_trade_cap_pct: 0.02
        total_exposure_cap_pct: 0.30
    - id: "risk_gate"
      token_ref:
        token_id: "risk.ftmo_compliance"
        version: ">=1.0"
      inputs:
        size: "position_sizer.contracts"
        signal: "regime_gate.signal"
      params:
        max_daily_dd_pct: 5.0
        max_absolute_dd: 1000.0
        max_open_positions: 5
  outputs:
    signal: "regime_gate.signal"
    size: "position_sizer.contracts"
    final: "risk_gate.approved_size"
capabilities:
  - core
  - regime_aware
