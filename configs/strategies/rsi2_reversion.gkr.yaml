ir_version: "qst-ir/0.4"
canonical_version: "qst-canonical/0.4"
strategy:
  id: "orca-rsi2-reversion-v1"
  version: "1.0.0"
  nodes:
    - id: "rsi2"
      token_ref:
        token_id: "indicator.rsi2"
        version: ">=1.0"
      params:
        rsi_period: 2
    - id: "reversion_signal"
      token_ref:
        token_id: "signal.threshold"
        version: ">=1.0"
      inputs:
        oscillator: "rsi2.value"
      params:
        oversold: 5.0
        overbought: 95.0
        exit_neutral: 50.0
        atr_period: 14
        atr_multiplier: 1.5
        max_hold_bars: 20
    - id: "regime_gate"
      token_ref:
        token_id: "risk.regime_filter"
        version: ">=1.0"
      inputs:
        signal: "reversion_signal.signal"
      params:
        blocked_states: [3]
    - id: "position_sizer"
      token_ref:
        token_id: "size.kelly_fractional"
        version: ">=1.0"
      inputs:
        signal: "regime_gate.signal"
      params:
        multiplier: 0.25
        per_trade_cap_pct: 0.02
        total_exposure_cap_pct: 0.30
    - id: "risk_gate"
      token_ref:
        token_id: "risk.ftmo_compliance"
        version: ">=1.0"
      inputs:
        size: "position_sizer.contracts"
        signal: "regime_gate.signal"
      params:
        max_daily_dd_pct: 5.0
        max_absolute_dd: 1000.0
        max_open_positions: 5
  outputs:
    signal: "regime_gate.signal"
    size: "position_sizer.contracts"
    final: "risk_gate.approved_size"
capabilities:
  - core
  - mean_reversion
