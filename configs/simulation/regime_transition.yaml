# Regime transition matrix configuration for synthetic data generation
# Used by orca simulate generate-regime

regimes:
  - id: 0
    name: Calm
    avg_duration: 60
  - id: 1
    name: Trending
    avg_duration: 40
  - id: 2
    name: HighVol
    avg_duration: 20
  - id: 3
    name: Crisis
    avg_duration: 8

# Rows = from_regime, Cols = to_regime
transition_matrix:
  # From \ To:     Calm  Trend  HighVol  Crisis
  - [0.80,      0.15,  0.04,   0.01]   # Calm
  - [0.10,      0.75,  0.12,   0.03]   # Trending
  - [0.05,      0.10,  0.75,   0.10]   # HighVol
  - [0.01,      0.02,  0.10,   0.87]   # Crisis

# Per-regime default parameters for synthetic generation
regime_params:
  calm:
    mu: 0.0002
    sigma: 0.008
    jump_intensity: 0.0
    jump_mean: 0.0
    jump_std: 0.0
    volume_mult: 1.0
    spread_mult: 1.0
    fill_prob: 1.0
    trend_bias: 0.0
  trending:
    mu: 0.0008
    sigma: 0.014
    jump_intensity: 0.02
    jump_mean: 0.0
    jump_std: 0.01
    volume_mult: 1.1
    spread_mult: 1.0
    fill_prob: 0.98
    trend_bias: 0.6
  high_vol:
    mu: -0.0003
    sigma: 0.028
    jump_intensity: 0.08
    jump_mean: -0.005
    jump_std: 0.025
    volume_mult: 1.3
    spread_mult: 2.0
    fill_prob: 0.90
    trend_bias: -0.3
  crisis:
    mu: -0.0015
    sigma: 0.065
    jump_intensity: 0.25
    jump_mean: -0.015
    jump_std: 0.050
    volume_mult: 0.5
    spread_mult: 3.0
    fill_prob: 0.70
    trend_bias: -0.8
