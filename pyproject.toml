[project]
name = "orca"
version = "0.1.0"
description = "OrcaAlgo — Strategy IR, mathematical models, calibration, and attribution"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "typer>=0.9",
    "structlog>=23",
]

[project.scripts]
orca = "orca.cli:app"
orca-validate = "orca.cli:validate"
orca-calibrate = "orca.cli:calibrate"
orca-hash = "orca.cli:hash_cmd"
orca-preflight = "orca.cli:preflight"
orca-attribute = "orca.cli:attribute"
orca-data-validate = "orca.cli:data_validate"
orca-ir-compile = "orca.cli:ir_compile"
orca-sim-calibrate = "orca.cli:sim_calibrate"
orca-generate-1m = "orca.cli:generate_1m"
orca-ticks = "orca.cli:ticks"
orca-sim-validate = "orca.cli:sim_validate"
orca-generate-regime = "orca.cli:generate_regime"
orca-inject-signal = "orca.cli:inject_signal"
orca-bootstrap = "orca.cli:bootstrap"
orca-calibrate-regime = "orca.cli:calibrate_regime"
orca-validate-regime = "orca.cli:validate_regime"
orca-status = "orca.cli:status"
orca-halt = "orca.cli:halt"

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
    "pytest-rerunfailures>=15.0",
    "pytest-timeout>=2.3",
    "hypothesis>=6",
    "ruff>=0.1",
    "mypy>=1.8",
]
ml = [
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "scikit-learn>=1.3",
    "hmmlearn>=0.3",
    "hummingbird-ml>=0.4",
    "onnx>=1.15",
    "skl2onnx>=1.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "A", "S", "PYI", "RUF", "UP"]
# Noise rules intentionally not enforced by this codebase:
#   E501      — line length is a soft preference, not a hard gate
#   N806/N803 — legacy naming drift (camelCase in the data pipeline)
#   B008      — typer.Option(...) in CLI argument defaults is idiomatic
#   S         — flake8-bandit false positives in data-ingestion/orchestration
#               code; real secret scanning runs in the dedicated security job
ignore = ["E501", "N806", "N803", "B008", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
# Relaxed from `strict`: the legacy ML/data-pipeline modules predate full
# typing. Keep the high-signal checks and drop the strict-only noise
# (untyped defs, any-generics, any-returns) that produces the bulk of errors.
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
# Third-party numeric/ML libraries ship without py.typed stubs (sklearn, scipy,
# hmmlearn, …); treat their imports as Any rather than failing type analysis.
ignore_missing_imports = true

# Legacy modules predate the typed core and are scoped out until refactored.
# The sizing/math/benchmark/risk/ir/models cores remain fully type-checked.
[[tool.mypy.overrides]]
module = [
    "orca.optimize.*",
    "orca.vectorbt.*",
    "orca.ml.*",
    "orca.simulation.*",
    "orca.data.*",
    "orca.cli",
]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short --timeout=300"
