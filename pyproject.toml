[project]
name = "orca"
version = "0.1.0"
description = "OrcaAlgo — Strategy IR, mathematical models, calibration, and attribution"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "typer>=0.9",
    "structlog>=23",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
    "hypothesis>=6",
    "ruff>=0.1",
    "mypy>=1.8",
]
ml = [
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "scikit-learn>=1.3",
    "hmmlearn>=0.3",
    "hummingbird-ml>=0.4",
    "onnx>=1.15",
    "skl2onnx>=1.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "A", "S", "PYI", "RUF", "UP"]

[tool.mypy]
strict = true
python_version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
