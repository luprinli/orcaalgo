  <circle cx="18.5" cy="32" r="1.3" fill="#0f172a"/>
  <!-- Dorsal fin -->
  <path d="M34 30 L42 16 L38 27" fill="#2563eb" stroke="#1e40af" stroke-width="0.8"/>
  <!-- Tail flukes -->
  <path d="M10 38 Q4 26 0 28" fill="url(#orca-grad)" stroke="#1e40af" stroke-width="0.8"/>
