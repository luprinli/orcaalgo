<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <style>
    @media (prefers-color-scheme: dark) {
      .orca-body { fill: #93c5fd; stroke: #60a5fa; }
      .orca-belly { fill: #bfdbfe; opacity: 0.5; }
      .orca-eye-w { fill: #bfdbfe; opacity: 0.7; }
      .orca-eye-p { fill: #0f172a; opacity: 0.9; }
      .orca-fin { fill: #93c5fd; stroke: #60a5fa; }
    }
  </style>
  <!-- Body -->
  <ellipse class="orca-body" cx="28" cy="38" rx="18" ry="10" fill="#2563eb" stroke="#1e40af" stroke-width="1"/>
  <!-- Belly -->
  <ellipse class="orca-belly" cx="30" cy="43" rx="11" ry="5" fill="#f0f9ff" opacity="0.7"/>
  <!-- Eye -->
  <ellipse class="orca-eye-w" cx="20" cy="32" rx="3.5" ry="2.5" fill="#f0f9ff" opacity="0.8"/>
  <circle class="orca-eye-p" cx="18.5" cy="32" r="1.3" fill="#0f172a" opacity="0.85"/>
  <!-- Dorsal fin -->
  <path class="orca-fin" d="M34 30 L42 16 L38 27" fill="#2563eb" stroke="#1e40af" stroke-width="0.8"/>
  <!-- Tail flukes -->
  <path class="orca-fin" d="M10 38 Q4 26 0 28" fill="#2563eb" stroke="#1e40af" stroke-width="0.8"/>
  <path class="orca-fin" d="M10 38 Q4 50 0 48" fill="#2563eb" stroke="#1e40af" stroke-width="0.8"/>
</svg>
