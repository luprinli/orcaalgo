name: Scheduled Dependency Audit

on:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 06:00 UTC
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Go vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Python dependency audit
        run: |
          pip install pip-audit
          pip-audit

      - name: npm audit
        working-directory: web
        run: npm audit --audit-level=high

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const message = `:warning: Dependency audit failed on \`${context.repo.owner}/${context.repo.repo}\`. Review [the workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`;
            console.log(message);
