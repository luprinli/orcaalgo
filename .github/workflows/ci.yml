name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
  # PYTHON â€” Lint + Type Check + Test + Coverage
  # â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check orca/ tests/

      - name: Ruff format check
        run: ruff format --check orca/ tests/

      - name: Mypy strict
        run: mypy orca/

      - name: Pytest with coverage
        run: pytest tests/ -v --cov=orca --cov-report=xml --cov-report=term --cov-fail-under=80

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          flags: python

  # â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
  # GO â€” Lint + Vet + Test + Race + Coverage + E2E
  # â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: orca
          POSTGRES_PASSWORD: orca
          POSTGRES_DB: orca_core
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

      - name: go vet
        run: go vet ./...

      - name: Unit tests (race + coverage)
        run: |
          go test ./internal/... -race -count=1 -short -coverprofile=coverage.out -coverpkg=./internal/...
        env:
          ORCA_JWT_SECRET: ci-test-secret
          ORCA_ADMIN_PASSWORD: ci-admin-pass

      - name: Coverage gate
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${COVERAGE}%"
          if [ "$(echo "$COVERAGE < 60" | bc -l)" -eq 1 ]; then
            echo "Coverage ${COVERAGE}% is below 60% threshold"
            exit 1
          fi

      - name: E2E tests
        run: go test -tags=e2e ./test/e2e/ -count=1 -v
      - name: Run replay parity tests
        run: go test ./internal/engine/ -run TestReplayParity -count=1 -v
        env:
          ORCA_JWT_SECRET: ci-test-secret
          ORCA_ADMIN_PASSWORD: ci-admin-pass

      - name: Build with provenance (assert engine version is a git SHA)
        run: |
          GIT_SHA=$(git rev-parse HEAD)
          go build -ldflags "-X github.com/lee-econ/orca-core/internal/version.Commit=${GIT_SHA} -X github.com/lee-econ/orca-core/internal/version.BuildTime=$(date -u +%FT%TZ)" -o bin/orca-cli ./cmd/orca-cli
          ENGINE_VER=$(./bin/orca-cli version --engine)
          echo "Engine version: ${ENGINE_VER}"
          if [ "${ENGINE_VER}" = "dev" ] || [ -z "${ENGINE_VER}" ]; then
            echo "FAIL: engine version not injected (got '${ENGINE_VER}')"
            exit 1
          fi
          if ! git cat-file -e "${ENGINE_VER}^{commit}" 2>/dev/null; then
            echo "FAIL: engine version '${ENGINE_VER}' is not a valid commit in this repo"
            exit 1
          fi

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: coverage.out
          flags: go

  # â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
  # WEB â€” ESLint + TypeScript + Build
  # â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: ESLint
        run: npm run lint
        working-directory: web

      - name: TypeScript check
        run: npm run typecheck
        working-directory: web

      - name: Build
        run: npm run build
        working-directory: web

  # â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
  # GKR â€” Strategy IR Validation
  # â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
  gkr-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install orca package
        run: pip install -e ".[dev]"

      - name: Validate all GKR strategies
        run: orca validate configs/strategies/*.gkr.yaml

  # â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
  # ANTI-PATTERN SCAN â€” 10 Hard Prohibition Enforcement
  # â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
  anti-pattern-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Scan for antipattern violations
        run: python scripts/anti_pattern_scan.py

      - name: Parity drift scan (Rule 11)
        run: python scripts/parity_drift_scan.py --strict

  # â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
  # SECURITY â€” Secrets + Dependency Audit
  # â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: gitleaks/gitleaks-action@v2
        with:
          config-path: .gitleaks.toml

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Go vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
  # GUARDIAN â€” Regression Smoke Tests
  # â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
  guardian:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: orca
          POSTGRES_PASSWORD: orca
          POSTGRES_DB: orca_core
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install Python dependencies
        run: pip install -e ".[dev]"

      - name: Guardian Python tests
        run: pytest tests/guardian/ -v --tb=short

      - name: Guardian Go tests
        run: go test -tags=guardian ./tests/guardian/ -v -count=1
        env:
          ORCA_JWT_SECRET: ci-test-secret
          ORCA_ADMIN_PASSWORD: ci-admin-pass

  # â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
  # MUTATION TESTING â€” Critical Math (main branch only)
  # â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
  mutation-test:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -e ".[dev]" && pip install mutmut

      - name: Mutation test critical math
        run: |
          mutmut run --paths-to-mutate orca/sizing/ orca/math/
          mutmut results | tee mutation_report.txt
          KILLED=$(grep -c "killed" mutation_report.txt || true)
          SURVIVED=$(grep -c "survived" mutation_report.txt || true)
          TOTAL=$((KILLED + SURVIVED))
          if [ "$TOTAL" -gt 0 ]; then
            RATE=$(echo "scale=2; $KILLED / $TOTAL * 100" | bc)
            echo "Mutation kill rate: ${RATE}%"
            if [ "$(echo "$RATE < 85" | bc -l)" -eq 1 ]; then
              echo "Mutation kill rate below 85% threshold"
              exit 1
            fi
          fi

      - name: Upload mutation report
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: mutation_report.txt
