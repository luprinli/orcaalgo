name: Pre-Deployment Gates

on:
  push:
    tags: ['v*']
  workflow_dispatch:  # Manual trigger for non-tag deployments

jobs:
  preflight:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: orca
          POSTGRES_PASSWORD: orca
          POSTGRES_DB: orca_core
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install Python dependencies
        run: pip install -e ".[dev]"

      - name: Run pre-flight checklist (strict)
        run: orca preflight --strict --config configs/config.prod.yaml
        continue-on-error: false

      - name: Verify GKR strategy hashes
        run: orca validate configs/strategies/*.gkr.yaml --strict
        continue-on-error: false

      - name: Run calibration audit
        run: orca calibrate --latest-only --output-dir reports/calibration/
        continue-on-error: false

      - name: Verify config integrity
        run: |
          EXPECTED_HASH=$(git show HEAD:configs/config.prod.yaml | sha256sum | cut -d' ' -f1)
          ACTUAL_HASH=$(sha256sum configs/config.prod.yaml | cut -d' ' -f1)
          if [ "$EXPECTED_HASH" != "$ACTUAL_HASH" ]; then
            echo "ERROR: Config hash mismatch — possible tampering"
            echo "Expected: $EXPECTED_HASH"
            echo "Actual:   $ACTUAL_HASH"
            exit 1
          fi
          echo "Config integrity: VERIFIED"

      - name: Kill-switch end-to-end test
        run: |
          go build -o bin/orca-server ./cmd/orca-server
          ./bin/orca-server &
          SERVER_PID=$!
          sleep 5

          # Trigger kill-switch
          curl -s -X POST http://localhost:8080/api/v1/admin/kill-switch \
            -H "Authorization: Bearer $(orca admin token 2>/dev/null || echo 'ci-test')" \
            -H "Content-Type: application/json" \
            -d '{"reason": "pre-deploy-test"}'

          sleep 2

          # Verify positions closed
          POSITIONS=$(curl -s http://localhost:8080/api/v1/positions | python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d) if isinstance(d,list) else 0)" 2>/dev/null || echo "0")
          if [ "$POSITIONS" != "0" ]; then
            echo "ERROR: Kill-switch failed — $POSITIONS positions still open after kill-switch"
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi
          echo "Kill-switch E2E: PASSED"

          kill $SERVER_PID 2>/dev/null || true

      - name: Upload pre-flight report
        uses: actions/upload-artifact@v4
        with:
          name: preflight-report
          path: reports/
